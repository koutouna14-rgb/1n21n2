name: Build plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        id: find
        run: |
          echo "Repo contents:"
          find . -path ./.git -prune -o -type f -print | sort
          POM=$(find . -name pom.xml -not -path "./.git/*" | head -n 1)
          if [ -z "$POM" ]; then echo "No pom.xml found anywhere in the repo"; exit 1; fi
          DIR=$(dirname "$POM")
          echo "Project folder: $DIR"
          if [ ! -d "$DIR/src/main/java" ]; then echo "No src/main/java next to pom.xml"; exit 1; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ steps.find.outputs.dir }}
        run: mvn -B clean package

      - name: Verify jar
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          unzip -l target/TeamEchestAddon.jar
          unzip -l target/TeamEchestAddon.jar | grep -q "plugin.yml" || { echo "plugin.yml missing from jar"; exit 1; }
          unzip -l target/TeamEchestAddon.jar | grep -q "TeamEchestAddon.class" || { echo "classes missing from jar"; exit 1; }

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamEchestAddon
          path: ${{ steps.find.outputs.dir }}/target/TeamEchestAddon.jar
          if-no-files-found: error

      - name: Update "latest" release
        if: github.event_name != 'pull_request'
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/TeamEchestAddon.jar \
            --title "Latest build" \
            --notes "Auto-built from ${{ github.sha }}"
